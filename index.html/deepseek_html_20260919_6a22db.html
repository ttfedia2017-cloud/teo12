<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Федор Трутнев — Бизнес-брокер</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121212;
            --accent-color: #D8C3A5;
            --text-color: #FFFFFF;
            --muted-text: #A0A0A0;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 20px;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: linear-gradient(145deg, #1a1a1a, #0d0d0d);
            border: 1px solid #333;
            border-radius: 20px;
            max-width: 450px;
            width: 100%;
            padding: 40px 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--accent-color);
        }

        .photo {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            object-position: center top;
            border: 3px solid var(--accent-color);
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(216, 195, 165, 0.2);
        }

        h1 {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 2px;
            margin: 0;
            text-transform: uppercase;
        }

        .job-title {
            color: var(--accent-color);
            font-size: 14px;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 5px;
            font-weight: 700;
        }

        .slogan {
            font-size: 12px;
            color: var(--muted-text);
            letter-spacing: 2px;
            margin: 15px 0 30px;
        }

        .services {
            text-align: left;
            margin-bottom: 30px;
        }

        .service-item {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            background: rgba(255,255,255,0.05);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 13px;
            border-left: 3px solid var(--accent-color);
        }

        .service-item span {
            margin-right: 12px;
            font-size: 16px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: block;
            text-decoration: none;
            color: var(--bg-color);
            background-color: var(--accent-color);
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            background-color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(216, 195, 165, 0.3);
        }

        .btn-outline {
            background-color: transparent;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
        }

        .btn-outline:hover {
            background-color: var(--accent-color);
            color: var(--bg-color);
        }

        .footer-text {
            margin-top: 25px;
            font-size: 10px;
            color: #444;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://sun9-7.vkuserphoto.ru/impg/sggWV4mfZfoizF2RTo0y8e6ywRWfm6xDyXFM2w/se1K_dAqo0U.jpg?size=458x604&quality=95&sign=df1bfbf75194e7418a38a85195647fe2&c_uniq_tag=OyHsygz1JWxh2tcAIRFTuAKNyOHUwDYXt3BKPnL-95Y" alt="Федор Трутнев" class="photo">
        
        <h1>Федор Трутнев</h1>
        <div class="job-title">Бизнес-брокер</div>
        <div class="slogan">БЫСТРО • ВЫГОДНО • НАДЕЖНО</div>

        <div class="services">
            <div class="service-item"><span>💎</span> Профессиональная оценка стоимости</div>
            <div class="service-item"><span>👥</span> Поиск реальных покупателей</div>
            <div class="service-item"><span>📄</span> Сопровождение сделки под ключ</div>
            <div class="service-item"><span>⏱</span> Консультация без оплаты</div>
        </div>

        <div class="links">
            <a href="https://t.me/Feodor_77" class="btn" target="_blank" rel="noopener">Telegram</a>
            <a href="https://vk.ru/id239142153" class="btn btn-outline" target="_blank" rel="noopener">ВКонтакте</a>
            <a href="https://www.instagram.com/fedot7_7" class="btn btn-outline" target="_blank" rel="noopener">Instagram</a>
        </div>

        <div class="footer-text">ОПЫТ. ЭКСПЕРТИЗА. РЕЗУЛЬТАТ.</div>
    </div>

</body>
</html>
